# LESSON 6 — netlify.toml tells Netlify how to run your site.
# Netlify reads this file automatically every time you change the repo.

[build]
  # The website files are in the main folder, so publish "." (dot = this folder)
  publish = "."
  # Where the server programs live
  functions = "netlify/functions"
  # No build step is needed — the site is plain HTML/CSS/JS
  command = "echo 'No build needed'"

[functions]
  node_bundler = "esbuild"

# Never publish the raw Instagram post folders or the guide's source as pages
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Security headers: stop other sites from framing your shop, etc.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Product photos rarely change, so browsers may keep them for a day
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
