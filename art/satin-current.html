<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)
    ✗ The UI controls (match YOUR parameters)

    Let your philosophy guide the implementation.
    The world is your oyster - be creative!
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satin Current</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Satin Current</h1>
            <div class="subtitle">Gold threads that fold into satin. Generative art for Aurantia: each seed weaves a different bolt of cloth.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZED) -->
            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Format</label>
                    <select id="format" class="seed-input" onchange="updateFormat(this.value)">
                        <option value="post">Instagram post 4:5</option>
                        <option value="story">Story / Reel 9:16</option>
                        <option value="square">Square 1:1</option>
                        <option value="wide">Website hero 2:1</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Threads</label>
                    <div class="slider-container">
                        <input type="range" id="threads" min="60" max="420" step="10" value="240" oninput="updateParam('threads', this.value)">
                        <span class="value-display" id="threads-value">240</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Drape (wave height)</label>
                    <div class="slider-container">
                        <input type="range" id="drape" min="0.05" max="0.45" step="0.01" value="0.22" oninput="updateParam('drape', this.value)">
                        <span class="value-display" id="drape-value">0.22</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Folds (noise detail)</label>
                    <div class="slider-container">
                        <input type="range" id="folds" min="0.4" max="4" step="0.1" value="1.6" oninput="updateParam('folds', this.value)">
                        <span class="value-display" id="folds-value">1.6</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Twist</label>
                    <div class="slider-container">
                        <input type="range" id="twist" min="0" max="3" step="0.05" value="1.1" oninput="updateParam('twist', this.value)">
                        <span class="value-display" id="twist-value">1.1</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Ribbon width</label>
                    <div class="slider-container">
                        <input type="range" id="band" min="0.15" max="0.9" step="0.01" value="0.46" oninput="updateParam('band', this.value)">
                        <span class="value-display" id="band-value">0.46</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Sheen (velvet → satin)</label>
                    <div class="slider-container">
                        <input type="range" id="sheen" min="1" max="40" step="1" value="14" oninput="updateParam('sheen', this.value)">
                        <span class="value-display" id="sheen-value">14</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Aura glow</label>
                    <div class="slider-container">
                        <input type="range" id="aura" min="0" max="1" step="0.05" value="0.55" oninput="updateParam('aura', this.value)">
                        <span class="value-display" id="aura-value">0.55</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Zircon glints</label>
                    <div class="slider-container">
                        <input type="range" id="glints" min="0" max="40" step="1" value="7" oninput="updateParam('glints', this.value)">
                        <span class="value-display" id="glints-value">7</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Pearls</label>
                    <div class="slider-container">
                        <input type="range" id="pearls" min="0" max="12" step="1" value="3" oninput="updateParam('pearls', this.value)">
                        <span class="value-display" id="pearls-value">3</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Ground (emerald)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#08362a" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#08362a</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Body gold</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#a8823c" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#a8823c</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Highlight</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#fff1c9" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#fff1c9</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="initializeSystem()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row" style="margin-top:8px">
                    <button class="button tertiary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // SATIN CURRENT — PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            format: 'post',
            threads: 240,     // how many gold threads make up the ribbon
            drape: 0.22,      // height of the long wave, as a fraction of canvas height
            folds: 1.6,       // detail of the noise gathers
            twist: 1.1,       // phase offset between neighbouring threads
            band: 0.46,       // width of the ribbon, as a fraction of canvas height
            sheen: 14,        // lighting exponent: low = velvet, high = satin
            aura: 0.55,       // strength of the warm glow under the ribbon
            glints: 7,        // max zircon sparks on the brightest crests
            pearls: 3,        // pearls resting on threads
            colorPalette: ['#08362a', '#a8823c', '#fff1c9']
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        const FORMATS = { post: [1080, 1350], story: [1080, 1920], square: [1200, 1200], wide: [2400, 1200] };
        const LIGHT = normalize2(-0.55, -1);       // light from the upper left
        const SAMPLES = 260;                      // points per thread

        // ═══════════════════════════════════════════════════════════════════════
        // SATIN CURRENT — ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let pg;                   // the cloth is woven onto this buffer
        let currentThread = 0;
        let crests = [];          // candidate positions for glints
        let threadPaths = [];
        let phases = {};
        let finished = false;

        function normalize2(x, y) { const m = Math.hypot(x, y); return [x / m, y / m]; }

        function setup() {
            const [w, h] = FORMATS[params.format];
            let canvas = createCanvas(w, h);
            canvas.parent('canvas-container');
            pixelDensity(1);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        // The cloth's height field: a long breathing wave plus gathered folds.
        // u ∈ [0,1] runs along the thread, v ∈ [0,1] runs across the ribbon.
        function surface(u, v) {
            const H = height;
            const twistPhase = v * params.twist * TWO_PI;
            // primary drape — the long wave of the logo line
            let y = Math.sin(u * TWO_PI * phases.f1 + phases.p1 + twistPhase * 0.35) * params.drape * H;
            // secondary crossing wave — the logo's second, finer line
            y += Math.sin(u * TWO_PI * phases.f2 + phases.p2 - twistPhase * 0.6) * params.drape * H * 0.38;
            // gathers: smooth noise, three octaves
            let amp = 0.5, freq = params.folds, n = 0;
            for (let o = 0; o < 3; o++) {
                n += (noise(u * freq + phases.nx, v * freq * 0.6 + phases.ny) - 0.5) * amp;
                amp *= 0.5; freq *= 2.1;
            }
            y += n * params.drape * H * 1.4;
            return y;
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            const [w, h] = FORMATS[params.format];
            if (width !== w || height !== h) resizeCanvas(w, h);

            phases = {
                f1: random(0.55, 1.05), p1: random(TWO_PI),
                f2: random(1.3, 2.3),  p2: random(TWO_PI),
                nx: random(1000), ny: random(1000),
                tilt: random(-0.12, 0.12)
            };
            crests = []; threadPaths = [];
            currentThread = 0; finished = false;

            pg = createGraphics(width, height);
            pg.pixelDensity(1);
            paintGround(pg);
            loop();
        }

        function paintGround(g) {
            const c = g.drawingContext;
            const [r, gg, b] = hexRgb(params.colorPalette[0]);
            // emerald ground with a lighter pool, like the slide backgrounds
            const grad = c.createRadialGradient(g.width * 0.32, g.height * 0.18, 0, g.width * 0.5, g.height * 0.5, Math.max(g.width, g.height) * 0.85);
            grad.addColorStop(0, `rgb(${r + 22},${gg + 30},${b + 22})`);
            grad.addColorStop(0.55, `rgb(${r},${gg},${b})`);
            grad.addColorStop(1, `rgb(${Math.max(0, r - 6)},${Math.max(0, gg - 22)},${Math.max(0, b - 16)})`);
            c.fillStyle = grad; c.fillRect(0, 0, g.width, g.height);

            // aura: a broad warm glow along the ribbon's centre line
            if (params.aura > 0) {
                const [gr, ggr, gb] = hexRgb(params.colorPalette[1]);
                c.save();
                c.filter = `blur(${Math.round(g.height * 0.06)}px)`;
                c.globalCompositeOperation = 'lighter';
                for (let i = 0; i <= 24; i++) {
                    const u = i / 24;
                    const x = u * g.width;
                    const y = g.height * (0.5 + phases.tilt * (u - 0.5)) + surface(u, 0.5);
                    const rad = g.height * params.band * 0.55;
                    const glow = c.createRadialGradient(x, y, 0, x, y, rad);
                    glow.addColorStop(0, `rgba(${gr},${ggr},${gb},${0.10 * params.aura})`);
                    glow.addColorStop(1, `rgba(${gr},${ggr},${gb},0)`);
                    c.fillStyle = glow; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
                }
                c.restore();
            }
        }

        function draw() {
            if (finished) return;
            // weave a batch of threads per frame so the cloth appears progressively
            const batch = 14;
            for (let k = 0; k < batch && currentThread < params.threads; k++, currentThread++) weaveThread(currentThread);
            image(pg, 0, 0);
            if (currentThread >= params.threads) {
                placeGlints(pg);
                placePearls(pg);
                finishing(pg);
                image(pg, 0, 0);
                finished = true;
                noLoop();
            }
        }

        function weaveThread(i) {
            const N = params.threads;
            const v = N === 1 ? 0.5 : i / (N - 1);
            const H = height, W = width;
            const centre = H * 0.5;
            const base = centre + (v - 0.5) * params.band * H;
            const body = hexRgb(params.colorPalette[1]);
            const hi = hexRgb(params.colorPalette[2]);
            const ground = hexRgb(params.colorPalette[0]);
            const c = pg.drawingContext;
            // threads at the ribbon edges fade into the ground, so the ribbon has soft selvedges
            const edge = Math.pow(Math.sin(v * Math.PI), 0.6);
            const pts = [];
            for (let s = 0; s <= SAMPLES; s++) {
                const u = s / SAMPLES;
                const x = -W * 0.04 + u * W * 1.08;
                const y = base + phases.tilt * H * (u - 0.5) + surface(u, v);
                pts.push([x, y]);
            }
            threadPaths.push(pts);
            c.lineWidth = Math.max(0.6, (H * params.band) / N * 0.62);
            c.lineCap = 'round';
            for (let s = 1; s < pts.length; s++) {
                const [x0, y0] = pts[s - 1], [x1, y1] = pts[s];
                // surface normal from the slope, compared with the light
                const dx = x1 - x0, dy = y1 - y0;
                const n = normalize2(dy, -dx);
                let lit = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1]);
                const spec = Math.pow(lit, params.sheen);
                const diffuse = 0.25 + 0.75 * lit;
                // compression between neighbours = a fold edge = extra shine
                const t = Math.min(1, spec * 1.15);
                let r = lerp(body[0] * diffuse, hi[0], t);
                let g = lerp(body[1] * diffuse, hi[1], t);
                let b = lerp(body[2] * diffuse, hi[2], t);
                r = lerp(ground[0], r, edge); g = lerp(ground[1], g, edge); b = lerp(ground[2], b, edge);
                c.strokeStyle = `rgba(${r | 0},${g | 0},${b | 0},${0.85})`;
                c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
                if (spec > 0.8 && edge > 0.6 && x1 > W * 0.06 && x1 < W * 0.94) crests.push([x1, y1, spec]);
            }
        }

        // four-pointed zircon sparks, only on the brightest crests
        function placeGlints(g) {
            if (!params.glints || !crests.length) return;
            const c = g.drawingContext;
            const picks = [];
            const minGap = g.height * 0.07;
            const pool = crests.slice().sort((a, b) => b[2] - a[2]);
            for (const p of pool) {
                if (picks.length >= params.glints) break;
                if (random() < 0.55) continue;
                if (picks.every(q => Math.hypot(q[0] - p[0], q[1] - p[1]) > minGap)) picks.push(p);
            }
            c.save(); c.globalCompositeOperation = 'lighter';
            for (const [x, y] of picks) {
                const s = Math.min(g.width, g.height) * random(0.009, 0.02);
                const glow = c.createRadialGradient(x, y, 0, x, y, s * 0.7);
                glow.addColorStop(0, 'rgba(255,248,225,0.7)'); glow.addColorStop(1, 'rgba(255,240,200,0)');
                c.fillStyle = glow; c.fillRect(x - s, y - s, s * 2, s * 2);
                c.fillStyle = 'rgba(255,253,245,0.95)';
                c.beginPath();
                c.moveTo(x, y - s); c.quadraticCurveTo(x, y, x + s * 0.28, y);
                c.quadraticCurveTo(x, y, x, y + s); c.quadraticCurveTo(x, y, x - s * 0.28, y);
                c.quadraticCurveTo(x, y, x, y - s); c.fill();
                c.beginPath();
                c.moveTo(x - s * 0.7, y); c.quadraticCurveTo(x, y, x, y - s * 0.2);
                c.quadraticCurveTo(x, y, x + s * 0.7, y); c.quadraticCurveTo(x, y, x, y + s * 0.2);
                c.quadraticCurveTo(x, y, x - s * 0.7, y); c.fill();
            }
            c.restore();
        }

        // pearls resting on threads, lit from the same direction as the cloth
        function placePearls(g) {
            if (!params.pearls || !threadPaths.length) return;
            const c = g.drawingContext;
            const placed = [];
            for (let k = 0, tries = 0; k < params.pearls && tries < 200; tries++) {
                const path = threadPaths[floor(random(threadPaths.length * 0.3, threadPaths.length * 0.7))];
                const [x, y] = path[floor(random(path.length * 0.1, path.length * 0.9))];
                const r = Math.min(g.width, g.height) * random(0.011, 0.02);
                if (!placed.every(q => Math.hypot(q[0] - x, q[1] - y) > Math.min(g.width, g.height) * 0.18)) continue;
                placed.push([x, y]); k++;
                c.save();
                c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = r * 0.9; c.shadowOffsetY = r * 0.35;
                const sphere = c.createRadialGradient(x + LIGHT[0] * r * 0.45, y + LIGHT[1] * r * 0.45, r * 0.05, x, y, r);
                sphere.addColorStop(0, '#fffdf4'); sphere.addColorStop(0.45, '#efe1c2'); sphere.addColorStop(1, '#b49a6c');
                c.fillStyle = sphere; c.beginPath(); c.arc(x, y, r, 0, TWO_PI); c.fill();
                c.restore();
            }
        }

        // vignette and a whisper of grain, so it reads as photographed cloth
        function finishing(g) {
            const c = g.drawingContext;
            const v = c.createRadialGradient(g.width / 2, g.height / 2, Math.min(g.width, g.height) * 0.35, g.width / 2, g.height / 2, Math.max(g.width, g.height) * 0.75);
            v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(2,14,10,0.55)');
            c.fillStyle = v; c.fillRect(0, 0, g.width, g.height);
            g.loadPixels();
            const d = g.pixels;
            for (let i = 0; i < d.length; i += 4) {
                const n = (random() - 0.5) * 9;
                d[i] += n; d[i + 1] += n; d[i + 2] += n;
            }
            g.updatePixels();
        }

        function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        let regenTimer;
        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            clearTimeout(regenTimer);
            regenTimer = setTimeout(initializeSystem, 120);
        }

        function updateColor(colorId, value) {
            const idx = { color1: 0, color2: 1, color3: 2 }[colorId];
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        function updateFormat(value) { params.format = value; initializeSystem(); }

        function downloadPNG() { saveCanvas(`aurantia-satin-${params.format}-${params.seed}`, 'png'); }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            ['threads', 'drape', 'folds', 'twist', 'band', 'sheen', 'aura', 'glints', 'pearls'].forEach(k => {
                document.getElementById(k).value = params[k];
                document.getElementById(k + '-value').textContent = params[k];
            });
            document.getElementById('format').value = params.format;
            ['color1', 'color2', 'color3'].forEach((id, i) => {
                document.getElementById(id).value = params.colorPalette[i];
                document.getElementById(id + '-value').textContent = params.colorPalette[i];
            });
            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
